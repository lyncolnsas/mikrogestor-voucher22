<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Status do Hotspot • Bubblegum Hardcore</title>
  <meta http-equiv="refresh" content="15">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f472b6;
      --card: #ffffff;
      --border: #000000;
      --accent: #38bdf8;
      --green: #4ade80;
      --yellow: #fef08a;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Comfortaa', -apple-system, sans-serif;
      background-color: var(--bg);
      color: #000000;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0px var(--accent);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
    }
    .candy {
      font-size: 38px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px 0;
    }
    p.user-tag {
      font-size: 13px;
      color: #475569;
      margin: 0 0 18px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
      text-align: left;
    }
    .stat-box {
      background: #fdf2f8;
      border: 2px solid #000000;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 2px 2px 0px #000000;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 13px;
      font-weight: 700;
      color: #000000;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      appearance: none;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      border-radius: 14px;
      padding: 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: all 0.15s ease;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }
    .btn-green {
      background: var(--green);
      color: #000000;
    }
    .btn-danger {
      background: var(--danger);
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="candy">🍬</div>
      <h1>Conexão Ativa!</h1>
      <p class="user-tag">Usuário: <b>$(username)</b> • IP: $(ip)</p>

      <div class="grid">
        <div class="stat-box">
          <div class="stat-label">Tempo Conectado</div>
          <div class="stat-value">$(uptime)</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Download</div>
          <div class="stat-value">$(bytes-out-nice)</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Upload</div>
          <div class="stat-value">$(bytes-in-nice)</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Tempo Restante</div>
          <div class="stat-value">$(session-time-left)</div>
        </div>
      </div>

      <form action="$(link-logout)" name="logout" onSubmit="return openLogout()">
        <div class="actions">
          <a class="btn btn-green" href="https://google.com">Navegar na Internet</a>
          <button type="submit" class="btn btn-danger">Desconectar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
