<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectado! • Bubblegum Hardcore</title>
  <meta http-equiv="refresh" content="0; url=$(link-redirect)">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Comfortaa', -apple-system, sans-serif;
      background: #f472b6;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 4px solid #000000;
      box-shadow: 8px 8px 0px #38bdf8;
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
    }
    .candy-icon {
      font-size: 48px;
      display: inline-block;
      margin-bottom: 12px;
      animation: bounce 1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
    h2 {
      font-size: 20px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: #334155;
      margin: 0 0 16px 0;
    }
    .btn {
      display: inline-block;
      background: #4ade80;
      color: #000000;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      padding: 12px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="candy-icon">🍬</div>
    <h2>Acesso Liberado!</h2>
    <p>Você está conectado à internet.</p>
    <a id="btn-fallback" class="btn" href="$(link-redirect)">Continuar Navegando</a>
  </div>

  <script>
    var redirectUrl = '$(link-redirect)';
    setTimeout(function() {
      if (redirectUrl && redirectUrl !== '') {
        window.location.replace(redirectUrl);
      }
    }, 300);
  </script>
</body>
</html>
