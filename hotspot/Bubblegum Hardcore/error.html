<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Ops! Erro de autenticação • Bubblegum Hardcore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comfortaa', -apple-system, sans-serif;
      background: #f472b6;
      color: #000;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 4px solid #000000;
      box-shadow: 8px 8px 0px #38bdf8;
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .candy { font-size: 40px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 0 0 10px 0; }
    .err-msg {
      background: #fecdd3;
      border: 3px solid #000000;
      box-shadow: 3px 3px 0px #000000;
      color: #9f1239;
      font-weight: 700;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    p { font-size: 13px; color: #475569; margin: 0 0 16px 0; }
    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #000;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      padding: 12px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="candy">🍬</div>
    <h1>Não foi possível conectar</h1>
    <div class="err-msg">$(error)</div>
    <p>Verifique seu código de voucher ou usuário e senha e tente novamente.</p>
    <a class="btn" href="$(link-login)">Tentar Novamente</a>
  </div>
</body>
</html>
